# =============================================
# APPLICATION BRASIL BURGER - CONFIGURATION
# =============================================

# Informations application
app.name=Brasil Burger Management System
app.version=1.0.0
app.author=L3 ISM Group
app.description=Système de gestion de commandes Brasil Burger


# Neon PostgreSQL pour production
db.neon.url=jdbc:postgresql://ep-green-flower-a41njh0k-pooler.us-east-1.aws.neon.tech/neondb
db.neon.username=neondb_owner
db.neon.password=npg_ZSfnwt30JeKI
db.neon.driver=org.postgresql.Driver
db.neon.ssl.options=sslmode=require&channel_binding=require

# Choix de la base de données (mysql ou neon)
database.type=neon
database.pool.size=10
database.pool.max=20
database.connection.timeout=30000

# Configuration Cloudinary
# ===================================
cloudinary.cloud_name=drqsusznh
cloudinary.api_key=218493326687862
cloudinary.api_secret=modtkK3PoOOncmj0ACmnS1BfzZ8
cloudinary.secure=true
cloudinary.folder=brasil-burger/products
cloudinary.default.width=800
cloudinary.default.height=600
cloudinary.quality=auto
cloudinary.format=auto

# Paramètres application
# ===================================
default.locale=fr_FR
currency=XOF
timezone=Africa/Dakar
date.format=dd/MM/yyyy HH:mm:ss
decimal.separator=.
thousands.separator=,

# Paramètres sécurité
# ===================================
password.min.length=6
password.max.length=50
password.hash.algorithm=SHA-256
session.timeout.minutes=30
jwt.secret=brasil-burger-secret-key-change-in-production
jwt.expiration.hours=24

# Chemins fichiers
# ===================================
image.upload.local.path=./uploads/
image.allowed.extensions=jpg,jpeg,png,gif,webp
image.max.size.mb=5
log.file.path=./logs/brasil-burger.log

# Paramètres commande
# ===================================
order.default.status=EN_ATTENTE
order.auto.validate=false
delivery.default.fee=1000
order.number.prefix=CMD
order.number.format=CMD-yyyyMMdd-0000

# Configuration produits
# ===================================
menu.discount.percentage=10
tax.rate=18
product.default.archived=false
burger.default.prep.time=15
complement.default.volume=500ml

# Limites application
# ===================================
max.items.per.order=10
max.orders.per.day=50
max.products.per.page=20
max.users.per.page=15
max.commandes.per.page=25

# Notifications et emails
# ===================================
email.enabled=false
email.host=smtp.gmail.com
email.port=587
email.username=your-email@gmail.com
email.password=your-password
email.from=brasilburger@example.com

# SMS (Wave, Orange Money integration)
# ===================================
sms.provider=orange
orange.api.key=YOUR_ORANGE_API_KEY
orange.api.secret=YOUR_ORANGE_API_SECRET
wave.api.key=YOUR_WAVE_API_KEY

# Paramètres paiement
# ===================================
payment.wave.enabled=true
payment.orange.enabled=true
payment.cash.enabled=true
payment.card.enabled=false
payment.default.method=WAVE
payment.timeout.minutes=30

# Configuration livraison
# ===================================
delivery.zone.default.id=1
delivery.radius.km=20
delivery.estimated.time.minutes=45
delivery.free.threshold=10000

# Configuration API REST (pour future extension)
# ===================================
api.base.path=/api/v1
api.cors.allowed.origins=*
api.cors.allowed.methods=GET,POST,PUT,DELETE,OPTIONS
api.rate.limit.requests=100
api.rate.limit.duration=3600

# Mode débogage
# ===================================
debug.enabled=true
logging.level=INFO
show.sql.queries=false
test.data.load=true