services:
  - type: web
    name: bb-burger-gestionnaire
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: frankfurt
    plan: free
    branch: symfony
    
    envVars:
      - key: APP_ENV
        value: prod
      - key: APP_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: bb-burger-db
          property: connectionString
      - key: PORT
        value: 8080
      
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_URL
        sync: false

databases:
  - name: bb-burger-db
    databaseName: bb_burger
    plan: free